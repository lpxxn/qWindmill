<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102e59"/>
      <stop offset="0.58" stop-color="#1769d2"/>
      <stop offset="1" stop-color="#19a4b9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角底板与柔和高光呼应程序的蓝色主按钮。 -->
  <rect x="4" y="4" width="248" height="248" rx="54" fill="url(#background)"/>
  <rect x="4" y="4" width="248" height="248" rx="54" fill="url(#glow)"/>
  <rect x="5.5" y="5.5" width="245" height="245" rx="52.5" fill="none" stroke="#ffffff" stroke-opacity="0.23" stroke-width="3"/>

  <!-- 底座与锥形塔身，让小尺寸图标仍能读出风机轮廓。 -->
  <path d="M124 119h8l13 91h-34z" fill="#ffffff"/>
  <path d="M102 211h52" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- 同一叶片旋转三次，形成简洁的风力机符号。 -->
  <g fill="#ffffff">
    <path d="M121 105c-7-22-11-53-3-76 3-9 10-13 15-5 7 21 7 53 0 81z"/>
    <path d="M121 105c-7-22-11-53-3-76 3-9 10-13 15-5 7 21 7 53 0 81z" transform="rotate(120 128 108)"/>
    <path d="M121 105c-7-22-11-53-3-76 3-9 10-13 15-5 7 21 7 53 0 81z" transform="rotate(240 128 108)"/>
  </g>
  <circle cx="128" cy="108" r="15" fill="#ffffff"/>
  <circle cx="128" cy="108" r="7" fill="#57e4dd"/>
</svg>
